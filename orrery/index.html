<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060b" />
    <title>Lumerian Orrery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="scene"></div>

    <header id="masthead">
      <h1>Lumerian Orrery</h1>
      <div id="clock"></div>
    </header>

    <div id="view-toggle" role="group" aria-label="Sky model">
      <button data-mode="helio" class="active">Heliocentric</button>
      <button data-mode="geo">Geocentric</button>
    </div>

    <aside id="sky">
      <button id="sky-toggle" aria-expanded="true">The Sky Now</button>
      <ul id="sky-list"></ul>
    </aside>

    <div id="time-bar" role="group" aria-label="Time speed">
      <button data-rate="-2592000" title="One month per second, backwards">◂◂</button>
      <button data-rate="-86400" title="One day per second, backwards">◂</button>
      <button data-rate="1" class="active" id="now-btn" title="Return to the present moment">Now</button>
      <button data-rate="86400" title="One day per second">▸</button>
      <button data-rate="604800" title="One week per second">▸▸</button>
      <button data-rate="2592000" title="One month per second">▸▸▸</button>
    </div>

    <aside id="panel" aria-live="polite" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
