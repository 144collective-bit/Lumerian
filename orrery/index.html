<!doctype html>
<html lang="en" data-theme="observatory">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060b" />
    <title>Lumerian Orrery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="scene"></div>

    <header id="masthead">
      <h1>Lumerian Orrery</h1>
      <div id="clock"></div>
    </header>

    <div id="view-toggle" role="group" aria-label="Sky model">
      <button data-mode="helio" class="active">Heliocentric</button>
      <button data-mode="geo">Geocentric</button>
    </div>

    <button id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
    <div id="menu" hidden>
      <section>
        <h3>Style</h3>
        <div id="theme-list" role="radiogroup" aria-label="Interface style"></div>
      </section>
      <section>
        <h3>Layers</h3>
        <label class="switch"><input type="checkbox" data-layer="aspects" checked /><span>Aspect lines</span></label>
        <label class="switch"><input type="checkbox" data-layer="figures" checked /><span>Constellations</span></label>
        <label class="switch"><input type="checkbox" data-layer="paths" checked /><span>Orbits and trails</span></label>
        <label class="switch"><input type="checkbox" data-layer="labels" checked /><span>Labels</span></label>
      </section>
      <section>
        <button id="home-btn" class="wide">Reset view</button>
      </section>
    </div>

    <aside id="sky">
      <div id="sky-head">
        <button id="sky-toggle" aria-expanded="true" aria-label="Show or hide the sky panel"></button>
        <div id="sky-tabs" role="tablist">
          <button role="tab" data-tab="sky" class="active">Sky</button>
          <button role="tab" data-tab="aspects">Aspects</button>
          <button role="tab" data-tab="moment">Moment</button>
          <button id="natal-btn" class="action">Natal</button>
        </div>
      </div>
      <ul id="sky-list" class="tab-body"></ul>
      <ul id="aspect-list" class="tab-body" hidden></ul>
      <div id="moment" class="tab-body" hidden></div>
    </aside>

    <div id="time-bar">
      <div class="scrub">
        <span class="end">−1 yr</span>
        <input type="range" id="scrub" min="-365" max="365" step="0.01" value="0" aria-label="Scrub through time" />
        <span class="end">+1 yr</span>
      </div>
      <div class="controls" role="group" aria-label="Time controls">
        <button data-rate="-2592000" title="One month per second, backwards">◂◂</button>
        <button data-rate="-86400" title="One day per second, backwards">◂</button>
        <button data-rate="0" title="Pause">❙❙</button>
        <button data-rate="1" class="active" id="now-btn" title="Return to the present moment">Now</button>
        <button data-rate="86400" title="One day per second">▸</button>
        <button data-rate="604800" title="One week per second">▸▸</button>
        <button data-rate="2592000" title="One month per second">▸▸▸</button>
        <input type="datetime-local" id="date-pick" aria-label="Jump to a date and time" />
      </div>
    </div>

    <aside id="natal" hidden></aside>

    <aside id="panel" aria-live="polite" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
